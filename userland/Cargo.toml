# A program, not a kernel.
#
# Deliberately outside the root workspace. It is not built for this machine and
# it is not built for the kernel's custom target -- it is built for ring 3, and
# the kernel's build.rs invokes this separately. Making it a workspace member
# would mean `cargo build` at the root tried to compile a freestanding user
# program for macOS.
[workspace]

[package]
name = "userland"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hello"
path = "src/main.rs"

[[bin]]
name = "forkdemo"
path = "src/forkdemo.rs"

[[bin]]
name = "bye"
path = "src/bye.rs"

[[bin]]
name = "spawner"
path = "src/spawner.rs"

[[bin]]
name = "spin"
path = "src/spin.rs"

[[bin]]
name = "pipedemo"
path = "src/pipedemo.rs"

[[bin]]
name = "sh"
path = "src/sh.rs"

[[bin]]
name = "greet"
path = "src/greet.rs"

[[bin]]
name = "upper"
path = "src/upper.rs"

[[bin]]
name = "echo"
path = "src/echo.rs"

[[bin]]
name = "catcher"
path = "src/catcher.rs"

[[bin]]
name = "deep"
path = "src/deep.rs"

[profile.release]
panic = "abort"
# Smaller is better here: every byte gets copied into a user page by hand.
opt-level = "s"
debug = false
