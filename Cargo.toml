# Two crates, because they compile for two different machines.
#
#   kernel/ -> x86_64-unknown-none : freestanding, no OS beneath it. This is 5AM-OS.
#   boot/   -> your Mac            : a normal program that wraps the kernel in a
#                                    bootable disk image.
#
# They are deliberately NOT one workspace member set with a shared target dir
# default, because `cargo build` at the root would try to build the kernel for
# macOS and fail in confusing ways.
[workspace]
resolver = "2"
members = ["kernel", "boot", "mkfs"]

[profile.release]
# A panic in a kernel has nowhere to unwind to — there is no runtime to catch it.
panic = "abort"
# Keep symbols: they are how we read a backtrace when things go wrong.
debug = true
